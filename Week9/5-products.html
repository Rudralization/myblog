<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        padding: 20px;
        background-color: #5dcef7;
      }

      .card {
        width: 180px;
        padding: 20px;
        background-color: #fff3f3;
        border: #df0000 solid 1px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h2>Products</h2>
    <div class="container">
      <div class="card">Laptop</div>
      <div class="card">Mouse</div>
      <div class="card">Keyboard</div>
      <div class="card">Monitor</div>
    </div>
  </body>
</html>
