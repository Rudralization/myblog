<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background-color: #333;
        padding: 10px;
      }

      .menu {
        display: flex;
        gap: 10px;
      }

      .navbar a {
        color: white;
        text-decoration: none;
        padding: 8px 16px;
      }

      .navbar a:hover {
        background-color: #a39696;
        transform: scale(1.1);
        border-radius: 5px;
      }

      @media (max-width: 600px) {
        .navbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }

        .menu {
          display: flex;
          flex-direction: column;
          width: 100%;
        }
        .logo {
          color: white;
          font-size: 20px;
          font-weight: bold;
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="logo">WebShop</div>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </body>
</html>
