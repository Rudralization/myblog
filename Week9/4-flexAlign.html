<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        height: 400px;
        display: flex;
        align-items: center;
        /* align-items: flex-end; */
        justify-content: center;
        border: 1px solid rgb(243, 35, 35);
        padding: 20px;
        gap: 10px;

        flex-wrap: wrap;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: rgb(35, 205, 243);
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <h2>flexAlign</h2>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </body>
</html>
