<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: aqua;
      }
      .card {
        width: 300px;
        border: 1px solid black;
        padding: 16px;
        border-radius: 10px;
        background-color: white;
        text-align: center;
        margin: 0 auto;
      }
      .card img {
        width: 100%;
        border-radius: 8px;
      }
      .card button {
        border-radius: 7px;
        margin-top: 10px;
        padding: 10px 16px;
        background-color: royalblue;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://picsum.photos/300/200" alt="pic" />
      <h2>Card Title</h2>
      <p>This is simple card example</p>
      <button>Read More</button>
    </div>
  </body>
</html>
