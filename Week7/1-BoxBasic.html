<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .boxA {
        box-sizing: border-box;
        width: 200px;
        height: 200px;
        line-height: 100px;
        background-color: rgb(128, 213, 241);
        margin: auto;
      }

      .boxB {
        box-sizing: border-box;
        width: 200px;
        height: 200px;
        background-color: rgb(245, 112, 112);
        padding: 20px;
        margin: 20px;
        line-height: 100px;
      }
    </style>
  </head>
  <body>
    <h1>Box Model Basics</h1>
    <div class="boxA">This is a box.</div>

    <div class="boxB">This is another box</div>
  </body>
</html>
