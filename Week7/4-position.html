<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            position: relative;
            width: 200px;
            height: 100px;
            background-color: bisque;
        }

        .child {
            position: absolute;
            bottom: 1px;
            right: 20px;
            width: 50px;
            height: 30px;
            background-color: brown;
        }
    </style>
</head>

<body>
    <div class="parent"> Parent 
         <div class="child">Child</div>
    </div>
   
</body>

</html>
