<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        color: red;
      }
      #i1 {
        color: blue;
      }
      .c1 {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>CSS Priority</h1>
    <h1 id="i1" class="c1">KheMuji</h1>
    <p>
      📝 CSS Priority (Specificity) <br />
      CSS priority decides which style is applied <br />
      when multiple styles target the same element. <br />
      <br />
      🔢 Order of Priority (High → Low) <br />
      1. Inline CSS (inside HTML) <br />
      2. ID selector (#id) <br />
      3. Class selector (.class) <br />
      4. Element selector (p, div) <br />
    </p>
  </body>
</html>
