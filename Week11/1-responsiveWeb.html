<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        background-color: aquamarine;
        width: 100%;
        max-width: 400px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ccc;
        text-align: center;
      }

      @media (max-width: 700px) {
        .box {
          background-color: #e0e0e0;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Responsive Box</h2>
      <p>This is a simple responsive box.</p>
    </div>
  </body>
</html>
