<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 16px 40px;
        background-color: rgb(171, 171, 171);
      }
      .logo {
        color: rgb(0, 0, 0);
        font-size: 24px;
      }
      .menu {
        display: flex;
        gap: 20px;
      }
      .menu a {
        color: rgb(20, 0, 198);
        text-decoration: none;
      }
      .menu a:hover {
        background-color: rgb(171, 171, 171);
        transform: scale(1.1);
        border-radius: 5px;
      }
      @media (max-width: 600px) {
        .navbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }
        .menu {
          display: flex;
          flex-direction: column;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">MyShop</div>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>
  </body>
</html>
